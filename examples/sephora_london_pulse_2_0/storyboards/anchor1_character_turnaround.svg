<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0A10" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0A0B10" stop-opacity="1.0"/>
    </linearGradient>
    <linearGradient id="heroAccent" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF0055"/>
      <stop offset="100%" stop-color="#00F0FF"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1080" height="1920" fill="url(#bgGrad)"/>
  
  <!-- Subtle Studio Grid -->
  <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
    <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#252736" stroke-width="1" stroke-opacity="0.4"/>
  </pattern>
  <rect width="1080" height="1920" fill="url(#grid)"/>

  <!-- Top Cinema HUD -->
  <rect x="40" y="40" width="1000" height="70" rx="8" fill="#12131A" stroke="#2F3242" stroke-width="1.5"/>
  <text x="65" y="82" font-family="'Space Grotesk', system-ui, sans-serif" font-size="20" font-weight="700" fill="#00F0FF" letter-spacing="2">
    ANCHOR 1: CHARACTER TURNAROUND SHEET (DNA LOCK)
  </text>
  <text x="1015" y="82" font-family="'JetBrains Mono', monospace" font-size="14" fill="#8E92A8" text-anchor="end">
    MODEL: gemini-3-pro-image | 5600K DIFFUSE STUDIO | POLARITY LOCK
  </text>

  <!-- 3-Panel Turnaround Frames -->
  <!-- Panel 1: Front Full Body -->
  <rect x="40" y="140" width="320" height="1660" rx="10" fill="#151722" stroke="#2F3242" stroke-width="1"/>
  <text x="60" y="180" font-family="'JetBrains Mono', monospace" font-size="14" fill="#8E92A8">PANEL A: FRONT</text>
  <!-- Stylized Figure Front -->
  <circle cx="200" cy="300" r="51" fill="none" stroke="url(#heroAccent)" stroke-width="4" filter="url(#glow)"/>
  <path d="M 145 370 Q 200 350 255 370 L 270 590 L 130 590 Z" fill="#1E202F" stroke="url(#heroAccent)" stroke-width="3"/>
  <rect x="163" y="590" width="32" height="260" rx="8" fill="#282B3E" stroke="#3A3E56" stroke-width="2"/>
  <rect x="205" y="590" width="32" height="260" rx="8" fill="#282B3E" stroke="#3A3E56" stroke-width="2"/>

  <!-- Panel 2: 3/4 Dynamic Profile -->
  <rect x="380" y="140" width="320" height="1660" rx="10" fill="#151722" stroke="#2F3242" stroke-width="1"/>
  <text x="400" y="180" font-family="'JetBrains Mono', monospace" font-size="14" fill="#8E92A8">PANEL B: 3/4 ANGLE</text>
  <!-- Stylized Figure 3/4 -->
  <circle cx="540" cy="300" r="51" fill="none" stroke="url(#heroAccent)" stroke-width="4"/>
  <path d="M 495 370 Q 555 355 595 385 L 605 590 L 475 590 Z" fill="#1E202F" stroke="url(#heroAccent)" stroke-width="3"/>
  <rect x="503" y="590" width="32" height="260" rx="8" fill="#282B3E" stroke="#3A3E56" stroke-width="2"/>
  <rect x="545" y="590" width="32" height="260" rx="8" fill="#282B3E" stroke="#3A3E56" stroke-width="2"/>

  <!-- Panel 3: Tight Profile Macro -->
  <rect x="720" y="140" width="320" height="1660" rx="10" fill="#151722" stroke="#2F3242" stroke-width="1"/>
  <text x="740" y="180" font-family="'JetBrains Mono', monospace" font-size="14" fill="#8E92A8">PANEL C: PROFILE</text>
  <circle cx="880" cy="330" r="66" fill="none" stroke="url(#heroAccent)" stroke-width="4" filter="url(#glow)"/>
  <!-- Facial Profile Path -->
  <path d="M 880 270 Q 930 300 930 330 L 910 360 L 940 400 L 900 425" fill="none" stroke="#00F0FF" stroke-width="3"/>
  <path d="M 820 440 Q 900 420 950 470 L 950 650 L 820 650 Z" fill="#1E202F" stroke="url(#heroAccent)" stroke-width="3"/>

    <!-- Telemetry Lower Bar -->
  <rect x="40" y="1820" width="1000" height="60" rx="8" fill="#0C0D13" stroke="#2F3242" stroke-width="1"/>
  <text x="65" y="1857" font-family="'JetBrains Mono', monospace" font-size="14" fill="#00F0FF">
    SUBJECT: MODEL MAYA (THE NEON SIREN) | SILHOUETTE: Tall, athletic, razor-sharp high cheekbones, graph...
  </text>
  <text x="1015" y="1857" font-family="'JetBrains Mono', monospace" font-size="13" fill="#E5A93C" text-anchor="end">
    WARDROBE POLARITY: HIGH POLARITY A: Vivid high-gloss scarlet-red...
  </text>
</svg>